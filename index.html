<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Object Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>AI Object Detection System</h1>
    <p class="subtitle">YOLO Deep Learning • Image Classification & Object Detection</p>

    <div class="card">
        <form action="/predict" method="POST" enctype="multipart/form-data">
            <label class="upload">
                <span>📷 Choose an image</span>
                <input type="file" name="image" accept="image/*" required>
            </label>
            <button type="submit">🔍 Detect Objects</button>
        </form>
    </div>

    <div class="info">
        <h2>How it works</h2>
        <p>Upload an image. The YOLO model detects supported objects, draws bounding boxes, and reports the confidence for every detection.</p>
    </div>
</div>
</body>
</html>
