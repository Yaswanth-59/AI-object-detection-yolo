<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Detection Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Detection Result</h1>

    <div class="result-grid">
        <div class="card">
            <img class="result-image" src="{{ image_url }}" alt="Detected image">
        </div>

        <div class="card">
            <h2>Detected Objects: {{ count }}</h2>
            {% if detections %}
                {% for item in detections %}
                <div class="detection">
                    <strong>{{ item.name }}</strong>
                    <span>{{ item.confidence }}%</span>
                </div>
                {% endfor %}
            {% else %}
                <p>No objects detected above the confidence threshold.</p>
            {% endif %}
            <a class="button" href="/">← Detect Another Image</a>
        </div>
    </div>
</div>
</body>
</html>
